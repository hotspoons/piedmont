# The world editor on gh200-1.
#
# The WHOLE input to this release. Not a patch over what is already there.
enabled: true
fullnameOverride: worldeditor

image:
  # Pinned. `latest` would make "what is deployed" depend on when the pod last restarted.
  # `latest` until piedmont's first image build lands; then `just deploy-bump gh200-1` pins a sha-.
  tag: latest

# The route in: Gateway API, NOT the nginx Ingress this file used to render.
#
# Until 2026-10-11 this file said `ingress.enabled: true`, which renders an `Ingress` on
# `worldeditor.richard-siomporas.basedweights.com` — a host the arcade's own release in `default`
# already claims. The accepted split routes the editor through the platform's external Gateway
# instead (`piedmont.richard-siomporas.basedweights.com`): a ListenerSet in this namespace, a
# cert-manager Certificate, and the HTTPRoute + http->https redirect below. Because the file had
# drifted from the live release, `just deploy` would have replaced the working Gateway route with an
# Ingress nobody off-cluster can route to; it is now the live shape, verified by rendering this file
# and diffing against `helm get manifest worldeditor`. Turn on EXACTLY ONE of `ingress`, `httpRoute`
# or `gateway` (deploy/helm/worldeditor/values.yaml).
gateway:
  enabled: true
  parentRef:
    name: pai-managed-ext-gateway
    namespace: patapsco-richard-siomporas-platform
  hostnames:
    - piedmont.richard-siomporas.basedweights.com
  tlsSecretName: piedmont-worldeditor-tls
  issuer: letsencrypt-issuer
  redirect: true

# Ours, then the public mirrors (appended by the service). NO BOXES ON THE URLS ANY MORE.
#
# The editor reads piedmont's OWN North America instance (`overpass-na` in this namespace). It used
# to name the arcade's Maryland, europe and North-America instances across the namespace boundary
# (`overpass.default.svc`, `overpass-eu.default.svc`, `overpass-na.default.svc`); the split moved the
# editor onto piedmont's own instance, so those are gone from here. What each instance holds is
# `overpassRegions`: the Geofabrik region(s) it was built from, plus any an osm-import added (kept on
# the volume, services/overpass/README.md, "Where the OSM comes from").
overpassUrl: "http://overpass-na/api/interpreter"
overpassRegions: "overpass-na=north-america"
# EMPTY: an osm-import Job pulls the editor's default image (`wiktorn/overpass-api:latest`). The
# digest this file once pinned was the `default`-namespace instance's, not this namespace's, so it
# would have pulled the wrong build onto the node.
osmImportImage: ""

# Count free GPUs to size a splat run's fan-out. A CLUSTER-scoped read of nodes and of pods in
# every namespace — wider than anything else this chart asks for, which is why it is opt-in.
# Without it the editor reports that it could not ask, rather than reporting zero.
gpuVisibility: true

# ClusterRole/ClusterRoleBinding have no namespace: their names are global, so a second release of
# this chart collides with the arcade's `default` install (the `piedmont` install hit exactly this).
# The suffix keeps this release's RBAC distinct.
rbac:
  clusterResourceSuffix: "-piedmont"

# The Deploy panel's Cloudflare token. A token typed into the panel is forgotten whenever this
# release rolls; to keep one, create the Secret once and name it here:
#   kubectl -n "$NAMESPACE" create secret generic cloudflare --from-literal=CLOUDFLARE_API_TOKEN=<token>
# cloudflare:
#   secretName: cloudflare

# Ships empty. A blank world map means blank; worlds arrive by being drawn or imported.
seedSites: ""

data:
  # NAMED HERE, NOT IN THE CHART. The chart deliberately names no storage class so the cluster's
  # own default applies anywhere — but THIS cluster's claim already exists and was created on
  # ceph-filesystem, and a PVC's spec is immutable after creation. Omitting it made helm try to
  # patch the claim to no class at all and the upgrade was refused:
  #
  #   PersistentVolumeClaim "worldeditor-data" is invalid: spec: Forbidden: spec is immutable
  #
  # Which is the division of labour working correctly: the chart stays portable, and the file
  # that describes one cluster records what that cluster actually has.
  storageClass: ceph-filesystem

splat:
  # RWX IS NOT OPTIONAL, and this cluster's DEFAULT class cannot do it. `ceph-block` / `ceph-rbd`
  # are RBD, which is ReadWriteOnce; the fallback runner tiers' output volume is shared by a head
  # and its workers, so it needs CephFS. Left to the default it would sit Pending for ever — the
  # same failure the missing claim had, one layer down. (TrainingDeployment is installed here, so
  # `auto` picks that and this only matters when a run is pinned to jobset or batch.)
  storageClass: ceph-filesystem

# The live headless Blender, supervised by the pod: the rigging pipeline and MCP clients drive it.
blender:
  autostart: true
