# gh200-1 — 8x GH200, aarch64.
#
# Facts about the cluster, for the deploy script to read. Nothing here is release configuration:
# a release's values live beside this file.
cluster:
  name: gh200-1
  # Where every release below goes. A VALUE, not a convention: the charts name no namespace and
  # address each other by short service names, so the whole stack moves by changing this line.
  # `piedmont` is the new namespace the split is accepted in (docs/dev/project/ACCEPTANCE.md); the arcade-era
  # releases stay in `default` until they are retired.
  namespace: piedmont
  # The charts do not name a storage class — the cluster's default applies, which is what its
  # admin has chosen. Recorded here so the reason is visible, not so anything reads it.
  note: "RWX is required (a bake writes while the editor serves); the default class provides it."
releases:
  - name: worldeditor
    chart: deploy/helm/worldeditor
  - name: assetsvc
    chart: deploy/helm/assetsvc
  # piedmont's OWN Overpass: the North America instance (values in overpass-na.yaml). A fresh volume
  # IMPORTS before it serves (hours; see services/overpass/README.md). The editor reads it by short
  # name (worldeditor.yaml). This list used to say `overpass` — the arcade's Maryland instance — but
  # that release was never installed here; the accepted split brought North America into piedmont
  # instead, and Maryland, europe and the arcade's own north-america stay in `default` until retired
  # (overpass.yaml records the Maryland values but is not applied by this file).
  - name: overpass-na
    chart: deploy/helm/overpass
