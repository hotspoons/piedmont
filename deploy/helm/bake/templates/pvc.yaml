{{- if not .Values.data.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "piedmont-bake.fullname" . }}-data
  labels: {{- include "piedmont-bake.labels" . | nindent 4 }}
  annotations:
    # The bake's cache is the expensive part; do not let a `helm uninstall` throw it away.
    helm.sh/resource-policy: keep
spec:
  accessModes: [{{ .Values.data.accessMode }}]
  storageClassName: {{ .Values.data.storageClass }}
  resources:
    requests:
      storage: {{ .Values.data.size }}
{{- end }}
