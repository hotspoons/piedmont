{{- if or .Values.bake.enabled .Values.publish.enabled }}
{{- if .Values.bake.sitesJson }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "piedmont-bake.fullname" . }}-sites-{{ .Release.Revision }}
  labels: {{- include "piedmont-bake.labels" . | nindent 4 }}
data:
  sites.json: {{ .Values.bake.sitesJson | quote }}
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  # One Job per release revision: `helm upgrade` is how you say "bake again".
  name: {{ include "piedmont-bake.fullname" . }}-{{ .Release.Revision }}
  labels: {{- include "piedmont-bake.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.bake.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.bake.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "piedmont-bake.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      containers:
        - name: bake
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-ec"]
          args:
            - |
              {{- if and .Values.bake.enabled (not .Values.publish.only) }}
              python -m piedmont_bake fetch {{ .Values.bake.sites }}{{ if .Values.bake.skip }} --skip {{ .Values.bake.skip }}{{ end }}{{ range .Values.bake.args }} {{ . }}{{ end }}
              python -m piedmont_bake report
              {{- end }}
              {{- if .Values.publish.enabled }}
              python -m piedmont_bake publish {{ .Values.bake.sites }} --prefix "$PIEDMONT_S3_PREFIX"
              {{- end }}
          env:
            - name: PIEDMONT_DATA
              value: /data
            - name: PIEDMONT_HORIZON_M
              value: {{ .Values.horizonRadiusM | quote }}
            # A bake is a tile pyramid. The editor's Job sets the same variable; a chart bake
            # that omitted it used to write one mesh.
            - name: PIEDMONT_PYRAMID
              value: "1"
            # No BLAS/GDAL thread pool, so the forked profile/tile pools cannot inherit a held
            # lock (piedmont_bake/__main__.py sets the same defaults before numpy loads).
            - name: OPENBLAS_NUM_THREADS
              value: "1"
            - name: OMP_NUM_THREADS
              value: "1"
            - name: MKL_NUM_THREADS
              value: "1"
            - name: NUMEXPR_NUM_THREADS
              value: "1"
            - name: GDAL_NUM_THREADS
              value: "1"
            {{- if .Values.bake.sitesJson }}
            - name: PIEDMONT_SITES
              value: /config/sites.json
            {{- end }}
            {{- if .Values.publish.enabled }}
            - name: PIEDMONT_S3_BUCKET
              value: {{ .Values.publish.bucket | quote }}
            - name: PIEDMONT_S3_ENDPOINT
              value: {{ .Values.publish.endpoint | quote }}
            - name: PIEDMONT_S3_REGION
              value: {{ .Values.publish.region | quote }}
            - name: PIEDMONT_S3_PREFIX
              value: {{ .Values.publish.prefix | quote }}
            {{- end }}
          {{- if .Values.publish.enabled }}
          envFrom:
            - secretRef:
                name: {{ .Values.publish.secretName }}
          {{- end }}
          resources: {{- toYaml .Values.bake.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
            {{- if .Values.bake.sitesJson }}
            - {name: sites, mountPath: /config, readOnly: true}
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "piedmont-bake.claimName" . }}
        {{- if .Values.bake.sitesJson }}
        - name: sites
          configMap:
            name: {{ include "piedmont-bake.fullname" . }}-sites-{{ .Release.Revision }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
