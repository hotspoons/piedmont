# Build and publish the Docker install's core image (deploy/docker/core): Docker-in-Docker that runs
# the world editor, assetsvc, Overpass and the bake containers on one host. docs/DOCKER.md.
#
# THE CONTEXT IS THE REPOSITORY ROOT: the image copies the Overpass regions scripts from
# deploy/helm/overpass/files, the same files the chart's ConfigMap is made of.
#
# The pattern is worldeditor-image.yml's: one native runner per architecture, each image smoke-tested
# on the architecture it will run on BEFORE it is pushed by digest, then one job stitches the
# digests into `latest` and `sha-<short>`.
name: Core image (Docker install)

on:
  push:
    branches: [main]
    paths:
      - 'deploy/docker/core/**'
      - 'deploy/helm/overpass/files/**'
      - '.github/workflows/core-image.yml'
  workflow_dispatch:

env:
  # THE ONE PLACE THE NAME LIVES. deploy/docker/docker-compose.yml and .env.example default to it.
  IMAGE: ghcr.io/hotspoons/piedmont-core

concurrency:
  group: core-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # build and LOAD, so the smoke test runs against exactly what will be pushed
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/core/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: piedmont-core:smoke
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.slug }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.slug }},mode=max

      # What this image can get wrong is all at start-up: a dockerd that will not run nested, a
      # stack that does not come up, an editor that cannot reach the socket and quietly falls back
      # to local subprocesses. So: start it as the compose file does (privileged, a host directory
      # at /srv/piedmont), and check each. Overpass is left out — its first start is a 20-minute import.
      - name: smoke — inner daemon, a nested container, the editor on the docker runner
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/piedmont"
          docker run -d --name core --privileged -p 8780:8780 \
            -v "$RUNNER_TEMP/piedmont:/srv/piedmont" \
            -e PIEDMONT_ROOT=/srv/piedmont -e PIEDMONT_SERVICES="worldeditor assetsvc" \
            -e GHCR_USER -e GHCR_TOKEN \
            piedmont-core:smoke
          fail() { echo "::error::$1"; docker logs --tail 200 core; docker exec core tail -n 60 /var/log/piedmont/dockerd.log || true; exit 1; }
          for _ in $(seq 1 60); do if docker exec core docker info >/dev/null 2>&1; then break; fi; sleep 2; done
          docker exec core docker info --format 'inner dockerd {{.ServerVersion}} on {{.Driver}}' || fail "the inner dockerd never answered"
          docker exec core docker run --rm busybox:1.36 echo "a nested container ran" || fail "the inner daemon cannot run a container"
          for _ in $(seq 1 120); do if curl -sf localhost:8780/api/health >/dev/null; then break; fi; sleep 5; done
          curl -sf localhost:8780/api/health >/dev/null || fail "the editor never answered through the core"
          curl -sf localhost:8780/api/ready | tee /dev/stderr \
            | node -e 'const b=JSON.parse(require("fs").readFileSync(0,"utf8")); if (b.runner !== "docker" || b.jobs?.available !== true || b.kubernetes?.ok !== true) { console.error("the editor is not running Jobs on the inner daemon:", JSON.stringify({ runner: b.runner, jobs: b.jobs, kubernetes: b.kubernetes })); process.exit(1) } console.log("editor: runner docker, daemon reachable")' \
            || fail "the editor is not on the docker runner"
          docker exec core docker compose -p piedmont ps
          docker rm -f core

      # only now, having started it, push this architecture by digest
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/core/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.slug }}
      - name: export digest
        run: |
          mkdir -p /tmp/digests
          d="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${d#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch the two into `latest` (what the compose file pulls) and `sha-<short>` (what a pinned
  # host names). Pushing a tag from each runner would have the second overwrite the first.
  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - name: stitch
        working-directory: /tmp/digests
        run: |
          args=()
          while IFS= read -r t; do [ -n "$t" ] && args+=(-t "$t"); done <<< "${{ steps.meta.outputs.tags }}"
          refs=()
          for d in *; do refs+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create "${args[@]}" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
